# Cron job to refresh our local credentials
apiVersion: batch/v1
kind: CronJob
metadata:
  name: refresh-ecr-creds
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "groundlight-edge-endpoint.labels" . | nindent 4 }}
spec:
  # Per-environment cadence from edgeArtifactsMap (hourly for GL_Public's 3h TTL;
  # every 15m for edge-artifacts AssumeRole's 1h TTL).
  schedule: {{ include "groundlight-edge-endpoint.credentialRefreshSchedule" . | quote }}
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: refresh-ecr-creds
        spec:
          {{- include "edge-endpoint.registry-credentials.podSpec" . | nindent 10 }}
