# Default values for groundlight-edge-endpoint.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global configuration for dependencies
global:
  # Enable OpenTelemetry dependency when needed for logging
  # Use: --set global.otelEnabled=true for local-splunk or cloud-splunk modes
  otelEnabled: false

# The Kubernetees namespace where the Edge Endpoint will be deployed
# We recommend that you don't change this value unless you're doing something unusual
# like running more that one instance of the Edge Endpoint in the same cluster
namespace: "edge"

# Image tag resolution. Leave imageTag empty to derive from edgeArtifactsMap via
# upstreamEndpoint (prod → "release", AG1/dev → "latest"). Explicit imageTag,
# edgeEndpointTag, or inferenceTag scalars still win when set.
imageTag: ""
edgeEndpointTag: ""
inferenceTag: ""

# Whether to use the minimal image for the inference server. Currently, the minimal image only
# supports binary and multiclass detectors, so be sure to keep this set to false if you're using
# an object detection or counting model. 
useMinimalImage: false

# Enable request-level tracing profiling for the edge endpoint.
# When enabled, per-request trace data (span timings, annotations) is written to
# /opt/groundlight/device/edge-profiling/ as JSONL files. Disabled by default.
enableProfiling: false

# Image queries are accepted only for detectors listed in the active edge config.
# A detector that is not listed is rejected. This device does not start an
# inference pod for it and does not send the image to the cloud.
# Set to false to accept an unlisted detector: the device starts an inference pod
# for it and sends the image to the cloud until that pod is ready.
requireConfiguredDetectors: true

# The image pull policy for the containers.
# The default value is "Always" which means that Kubernetes will always check to see if there's 
# a new version of the image with the requested tag available when starting containers.
imagePullPolicy: "Always"

# Whether to enable the HTTP (non-TLS) port on the edge endpoint.
# When set to false, only HTTPS access is available, and the HTTP port is fully disabled
# (removed from the Kubernetes Service, NGINX listener, and container port).
httpEnabled: false

# The HTTP port that the Edge Endpoint will listen on on the host (only used when httpEnabled is true).
# Within the cluster, edge-endpoint listens on port 30101 and can be addressed by
# other services in the cluster on that port using
# http://edge-endpoint-service.edge.svc.cluster.local:30101/ (or substitute the appropriate
# namespace if you've overridden the default value).
edgeEndpointPort: 30101
edgeEndpointHttpsPort: 30143

# Number of uvicorn worker processes in the edge-endpoint router container. A general guideline is
# to keep this at or below the number of CPU cores on the device.
uvicornWorkers: 8

# Maximum simultaneous connections per NGINX worker. This counts connections to the upstream
# servers as well as to clients, so one proxied request uses two.
nginxWorkerConnections: 256

# This is used as the base of the name for the PersistentVolume. The full name of the volume is 
# created by appending the namespace to this value. Generally, this should not be overridden.
# The PersistentVolume is used to store the model files and other data that the Edge Endpoint wants
# to persist between restarts. It is mapped to `/opt/groundlight/edge` on the host.
persistentVolumeNameBase: "edge-endpoint-pv"

# Edge Endpoint will default to using the GPU for inference. If you want to use the CPU instead,
# set this value to "cpu".
inferenceFlavor: "gpu"

# Whether to enable torch.compile (or equivalent) optimization in the inference server.
edgeCompileEnabled: false

# Server the inference pods run: "fastapi", or "triton" to serve the same models through NVIDIA
# Triton Inference Server. Triton uses the "<inferenceTag>-triton" image, which is x86_64 only with
# no minimal variant. After a change, the model updater moves existing inference pods to the new
# server one detector at a time.
inferenceServer: "fastapi"

# How Triton inference pods share each GPU: "none", where the GPU time-slices between the pods' separate
# CUDA contexts, or "mps", where one CUDA MPS daemon per node lets the kernels of every pod that joins run
# side by side. "mps" takes effect only with inferenceServer "triton" on an x86_64 GPU device; anywhere
# else it renders as "none". After a change, the model updater moves existing inference pods one detector
# at a time. Turning MPS off stops its daemon right away; a Triton pod whose next CUDA call needs the MPS
# server then restarts once and comes back time-sliced, and every detector is moved afterwards.
gpuSharing: "none"

mps:
  # Host directory holding the MPS daemon's pipe directory. Never /tmp/nvidia-mps: the NVIDIA container
  # toolkit mounts that path into every GPU container, which would pull FastAPI pods into MPS too.
  hostDirectory: /run/groundlight/mps
  # A Triton pod runs time-sliced instead of joining MPS once every GPU has this many MPS clients. NVIDIA's
  # limit per MPS server depends on the GPU architecture: 16 before Volta, 48 on Volta and Turing, and 60
  # on Ampere and later since CUDA 13.0 (R580 drivers). The default of 44 keeps 4 slots free below Volta
  # and Turing's 48 for rolling updates. Pre-Volta GPUs never join MPS, so the limit doesn't apply to them.
  maxClientsPerGpu: 44

# The user must provide the Groundlight API token as input or the deployment will fail
groundlightApiToken: ""

# For escalations and audits and calls that aren't handled by the Edge Endpoint, we forward
# to the Groundlight service in the cloud. If you're testing against another version
# of the Groundlight service (e.g., your own dev environment or the integ environment),
# you can override this value.
upstreamEndpoint: "https://api.groundlight.ai"

# Fallback AWS region for the ECR login, used only when the resolved ecrRegistry is not an
# ECR host (see groundlight-edge-endpoint.ecrRegion). usslg ECR is us-east-1 and GL_Public
# is us-west-2; both are derived from the registry host, so this normally goes unused.
awsRegion: "us-west-2"

# S3 FUSE mount configuration for model weights (pinamod + pretrained weights).
# mount-s3 mounts the S3 bucket as a local filesystem with local disk caching.
# bucket/region default from edgeArtifactsMap via upstreamEndpoint; set explicitly
# to override. mountPath/cachePath are host paths and are not environment-specific.
# enabled=false removes the privileged mount-s3 FUSE container (not allowed under the Pod
# Security "baseline" standard); inferenceDeployment.modelsVolume must then supply the models.
s3Mount:
  enabled: true
  bucket: ""
  region: ""
  mountPath: "/opt/groundlight/edge/pinamod-mount"
  cachePath: "/opt/groundlight/edge/pinamod-cache"

# Per-upstream artifact defaults (ECR, S3, image tag, cred refresh),
# keyed by canonical upstreamEndpoint origin.
edgeArtifactsMap:
  "https://api.groundlight.ai":
    ecrRegistry: "767397850842.dkr.ecr.us-west-2.amazonaws.com"
    s3Bucket: "pinamod-artifacts-public"
    s3Region: "us-west-2"
    imageTag: "release"
    credentialRefreshSchedule: "0 * * * *"
  "https://api.integ.groundlight.ai":
    ecrRegistry: "767397850842.dkr.ecr.us-west-2.amazonaws.com"
    s3Bucket: "pinamod-artifacts-public"
    s3Region: "us-west-2"
    imageTag: "release"
    credentialRefreshSchedule: "0 * * * *"
  "https://api.dev.groundlight.ai":
    ecrRegistry: "767397850842.dkr.ecr.us-west-2.amazonaws.com"
    s3Bucket: "pinamod-artifacts-public"
    s3Region: "us-west-2"
    imageTag: "release"
    credentialRefreshSchedule: "0 * * * *"
  "https://api.groundlight.dev.axon.com":
    ecrRegistry: "216731772508.dkr.ecr.us-west-2.amazonaws.com/edge"
    s3Bucket: "edge-model-artifacts-edgemodelartifactsdevreplicabucket131ac6fa"
    s3Region: "us-west-2"
    imageTag: "latest"
    credentialRefreshSchedule: "*/15 * * * *"
  "https://api.groundlight.usa.axon.com":
    ecrRegistry: "686194638722.dkr.ecr.us-east-1.amazonaws.com/edge"
    s3Bucket: "edge-model-artifac-edgemodelartifactsusslgreplicabucket0f431ed4"
    s3Region: "us-east-1"
    imageTag: "latest"
    credentialRefreshSchedule: "*/15 * * * *"

# Explicit override / escape hatch for the ECR image base (registry host plus
# optional repo prefix). When set, wins over edgeArtifactsMap. Leave empty to
# derive from upstreamEndpoint.
ecrRegistry: ""

# This sets the log level for all the containers, both edge endpoint and inference.
logLevel: "INFO"

# inference-model-updater behavior
modelUpdater:
  # Seconds the model-updater waits for a new inference pod rollout to become Ready
  # before logging a TimeoutError and moving on. Must comfortably exceed realistic
  # cold-load time on the slowest link the device must support, so that the for-loop
  # self-throttles back-to-back rollouts of the same detector (preventing memory
  # doubling when cloud frequently republishes a model on a slow network).
  # Stays below the inference startupProbe ceiling so the pod is never killed by
  # kubelet before the updater sees it succeed.
  rolloutReadyTimeoutSeconds: 1800  # 30 min

# inference pod (inferencemodel-*) behavior
inferenceDeployment:
  # Run inference pods with hostPID so pynvml can match PIDs against nvidia-smi for per-pod
  # VRAM reporting. Not allowed under the Pod Security "baseline" standard.
  hostPID: true
  # Kubernetes `resources` for the inference container, e.g. {limits: {nvidia.com/gpu: 1}}.
  # Needed on shared clusters, where each pod must be scheduled onto a node with a GPU.
  resources: {}
  # Kubernetes `tolerations` for inference pods, e.g. to run on tainted GPU nodes.
  tolerations: []
  # Kubernetes volume source (e.g. {nfs: {server: ..., path: ..., readOnly: true}}) mounted
  # at /opt/models (pinamod + pretrained-weights) in inference pods. Empty = the hostPath
  # the mount-s3 container populates (s3Mount.mountPath).
  modelsVolume: {}
  # CPU thread cap per inference pod for PyTorch/OpenMP/MKL/OpenBLAS intra-op parallelism.
  # Without this each pod defaults to ALL node cores, so N pods spawn N x cores threads
  # that thrash under load (observed: per-request CPU cost grew 5x and throughput collapsed
  # past ~3 detectors). Total compute threads ~= cpuThreads x (2 x num_detectors); keep
  # small (2-4) on dense multi-detector edges. Tune empirically per device.
  cpuThreads: 4
  # Number of uvicorn worker processes per inference pod. Raising it can improve GPU utilization
  # under load. Applies to inference deployments created after the change; existing ones keep
  # their value.
  # Only the FastAPI server reads it; it has no effect when inferenceServer is "triton".
  # TODO: Support Triton pods.
  workers: 1
  # Size of the memory-backed /dev/shm Triton's Python backend uses to pass requests to the model.
  tritonShmSizeLimit: 256Mi
  # Note: inference pods set no CPU requests or limits (BestEffort). Threads are bounded by
  # cpuThreads above, and most detectors are idle at any instant, so the scheduler launches
  # every detector regardless of core count and the OS time-slices simultaneous bursts.
  startupProbe:
    # Consecutive 10-second startup-probe failures before kubelet kills the container.
    # Ceiling = failureThreshold × 10s. Default 540 = 90 min.
    # The inference pod loads pretrained backbone weights from a mount-s3 FUSE
    # filesystem (HF_HUB_OFFLINE=1 against /opt/models/pretrained-weights). On slow
    # links with large backbones (SigLIP-V2, DINOv2-reg4) and many pods cold-loading
    # at once, the original 45-min ceiling can be tripped. Raise on devices with
    # constrained networks; lower if a wedged-pod symptom needs to be caught faster.
    failureThreshold: 540

# These values override the automated settings in _helpers.tpl to keep this short and sweet
# Don't override these
nameOverride: "edge-endpoint"
fullnameOverride: "edge-endpoint"

# Set some sensible limits on memory usage to avoid system crashing
k3sConfig:
  enabled: true
  evictionHardPercent: "15"
  evictionSoftPercent: "25" 
  evictionHardMinGB: "4"
  evictionSoftMinGB: "8"
  evictionGracePeriod: "10s"

serviceAccount:
  create: true
  name: ""

# Logging Configuration
# loggingMode options:
#   - "standard": Basic logging to stdout/files (no Splunk, no OTel)
#   - "local-splunk": Deploy local Splunk container
#   - "cloud-splunk": Does not deploy local Splunk container, points to cloud instance instead
loggingMode: "standard"

# Balena device configuration
balena:
  deviceUuid: "none"

# Splunk Configuration (used for local-splunk and cloud-splunk modes)
splunk:
  # Local Splunk container settings (for local-splunk mode)
  local:
    image:
      repository: splunk/splunk
      tag: "9.3.5"
    password: "admin123"
    hecToken: "abcd1234-5678-90ef-ghij-klmnopqrstuv"
    service:
      type: NodePort
      webNodePort: 30080    # Splunk Web UI
      hecNodePort: 30088    # HTTP Event Collector
      managementNodePort: 30089  # Management port
    persistence:
      dataSize: "10Gi"
      etcSize: "2Gi"
      storageClass: ""  # Use default storage class
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 2Gi
  
  # Cloud Splunk settings (for cloud-splunk mode)
  cloud:
    endpoint: "https://your-splunk-instance:8088/services/collector"
    token: "your-hec-token-here"
  
  # Common Splunk settings
  index: "edge_app"
  source: "edge-endpoint"
  sourcetype: "edge:endpoint:logs"
  
  # OpenTelemetry Collector configuration
  collector:
    image:
      repository: otel/opentelemetry-collector-contrib
      tag: "0.91.0"
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

# OpenTelemetry Collector dependency configuration
# This configures the official OpenTelemetry Helm chart as a dependency
opentelemetry-collector:
  # Enable the OpenTelemetry collector when logging modes require it
  # This gets set dynamically based on loggingMode
  enabled: false  # Will be overridden via --set at deployment time
  
  # DaemonSet mode for collecting logs from all pods on each node
  mode: daemonset
  
  namespaceOverride: "edge"
  
  nameOverride: "opentelemetry-collector"
  fullnameOverride: "opentelemetry-collector"
  
  # Use the contrib image which includes all receivers/processors
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.91.0"
  
  # Resource configuration
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  
  # Preset configurations
  presets:
    kubernetesAttributes:
      enabled: true
    logsCollection:
      enabled: false  # Disabled due to unsupported 'container' operator in v0.91.0
    kubeletMetrics:
      enabled: false
  
  config:
    receivers:
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/edge_opentelemetry-collector*/*/*.log
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          # Parse CRI format logs manually
          - type: regex_parser
            id: extract_metadata_from_filepath  
            regex: '^.*\/(?P<namespace>[^_]+)_(?P<pod_name>[^_]+)_(?P<uid>[a-f0-9\-]{36})\/(?P<container_name>[^\._]+)\/(?P<restart_count>\d+)\.log$'
            parse_from: attributes["log.file.path"]
          # Parse CRI log format: timestamp stream partial_flag log_message
          - type: regex_parser
            id: parse_cri_format
            regex: '^(?P<timestamp>[^\s]+) (?P<stream>stdout|stderr) (?P<partial>P|F) (?P<message>.*)$'
            parse_from: body
            timestamp:
              parse_from: attributes.timestamp
              layout: '%Y-%m-%dT%H:%M:%S.%LZ'
          # Extract log level from the message content
          - type: regex_parser
            id: extract_log_level
            regex: '(?:^|.*\s)(?P<level>DEBUG|INFO|WARN|WARNING|ERROR|CRITICAL|FATAL)(?:[:\s]|$)'
            parse_from: attributes.message
            on_error: 'send'
          # Parse JSON logs that are already structured
          - type: json_parser
            id: parse_json_logs
            parse_from: attributes.message
            on_error: 'send'  # Continue if not JSON
          # Parse FastAPI/Uvicorn HTTP access logs: "INFO: 10.42.0.1:50126 - "GET /health/ready HTTP/1.1" 200 OK"
          - type: regex_parser
            id: extract_fastapi_access_log
            regex: '(?P<client_ip>\d+\.\d+\.\d+\.\d+):(?P<client_port>\d+)\s+-\s+"(?P<http_method>\w+)\s+(?P<http_path>[^?\s]+)(?:\?(?P<http_query>[^"\s]*?))?(?:\s+[^"]*)?"\s+(?P<status_code>\d+)'
            parse_from: attributes.message  
            on_error: 'send'
          # Parse NGINX access logs: "NGINX: 10.42.0.1 - - [24/Sep/2025:17:16:24 +0000] "GET /health/ready HTTP/1.1" 200 18 "-" "kube-probe/1.33""
          - type: regex_parser
            id: extract_nginx_access_log
            regex: 'NGINX:\s+(?P<client_ip>\d+\.\d+\.\d+\.\d+)\s+-\s+-\s+\[(?P<nginx_timestamp>[^\]]+)\]\s+"(?P<http_method>\w+)\s+(?P<http_path>[^?\s]+)(?:\?(?P<http_query>[^"\s]*?))?(?:\s+[^"]*)?"\s+(?P<status_code>\d+)\s+(?P<response_size>\d+)\s+"(?P<referer>[^"]*)"\s+"(?P<user_agent>[^"]*)"'
            parse_from: attributes.message
            on_error: 'send'
    
    processors:
      # Add resource attributes for custom fields
      resource:
        attributes:
          - key: service.name
            value: "edge-endpoint"
            action: upsert
          - key: deployment.environment
            value: "edge"
            action: upsert
          - key: balena.device.uuid
            value: "${env:BALENA_DEVICE_UUID}"
            action: upsert
    
    exporters:
      # Splunk HEC exporter configuration
      splunk_hec:
        endpoint: "http://splunk.edge.svc.cluster.local:8088/services/collector"
        token: "abcd1234-5678-90ef-ghij-klmnopqrstuv"
        index: "edge_app"
        source: "edge-endpoint"
        sourcetype: "edge:endpoint:logs"
        disable_compression: false
        timeout: 10s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 120s
    
    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [k8sattributes, resource, memory_limiter, batch]
          exporters: [splunk_hec]
  
  # Mount host directories for log collection
  extraVolumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
    - name: varlibdockercontainers
      hostPath:
        path: /var/lib/docker/containers
  
  extraVolumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
    - name: varlibdockercontainers
      mountPath: /var/lib/docker/containers
      readOnly: true
  
  # Environment variables for custom attributes  
  extraEnvs:
    - name: BALENA_DEVICE_UUID
      valueFrom:
        configMapKeyRef:
          name: balena-config
          key: device-uuid
  
  # Security context to read log files  
  securityContext:
    runAsUser: 0
    runAsGroup: 0

# Network healer - automatically recovers service networking after host IP changes
#
# An alternative experimental approach is implemented on the `tim/network-hooks` branch:
# a NetworkManager dispatcher hook that restarts k3s when network/IP changes are detected.
# That approach has worked in testing, but it likely deserves deeper consideration before use
# in production deployments (operational risk, platform assumptions, and restart frequency).
networkHealer:
  enabled: true
  checkIntervalSeconds: 10

# ---------------------------------------------------------------------------------------
# Shared Kubernetes cluster support (e.g. EKS). The defaults below are the single-node k3s
# device deployment; values-eks.yaml turns each of them off. Pod Security "baseline" forbids
# hostPath, hostPID, privileged containers and cluster-admin-style hooks, so a namespace that
# enforces it needs all of these.
# ---------------------------------------------------------------------------------------

# The edgeArtifactsMap origin (e.g. "https://api.dev.groundlight.ai") whose ECR, S3 and tag
# defaults to use. When set, upstreamEndpoint may be any http(s) URL, such as an in-cluster
# service. When empty, upstreamEndpoint itself must be an https key of edgeArtifactsMap.
edgeArtifactsProfile: ""

# Create and own the namespace. Set false when the namespace already exists.
createNamespace: true

# Create the ClusterRole/ClusterRoleBinding that lets the status monitor read node metrics.
# Without it the status monitor shows no node-level resource usage.
nodeMetricsRbac: true

# Run the pre-install hook that validates the API token against the upstream.
validateApiToken: true

# Create and refresh the `registry-credentials` image pull secret from temporary credentials
# issued by the upstream. Disable when the nodes can already pull the images (e.g. from the
# cluster's own ECR).
registryCredentials:
  enabled: true

# Create the cluster-scoped `nvidia` RuntimeClass and set it on pods. Disable where the nodes'
# default container runtime already exposes the GPU.
nvidiaRuntimeClass: true

# Use hostPath volumes for device info, the escalation queue and the TLS certs. When false
# they are per-pod emptyDirs.
hostPathVolumes: true

# The model repo shared by the edge-endpoint pod and the inference pods. Empty = a hostPath
# PersistentVolume on the node. A StorageClass name = a dynamically provisioned ReadWriteMany
# claim, so inference pods can run on other nodes; SQLite and the active edge config then
# move to per-pod emptyDirs.
sharedModelRepo:
  storageClassName: ""
  size: 2Gi

# Service type for edge-endpoint-service: NodePort or ClusterIP.
service:
  type: NodePort
