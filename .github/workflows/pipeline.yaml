name: cicd
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    # This allows it to be triggered manually in the github console
    # You could put inputs here, but we don't need them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # This causes it to cancel previous in-progress actions in the same PR
  cancel-in-progress: true
env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.8.4"
  SDK_POETRY_VERSION: "2.1.3"
  # This is the token associated with "prod-biggies" (with shared credentials on 1password)
  GROUNDLIGHT_API_TOKEN: ${{ secrets.GROUNDLIGHT_API_TOKEN }}

jobs:
  test-unit-edge-endpoint:
    # Unit tests that don't need Docker. Split out from the integration job so
    # that a plain unit-test failure surfaces in ~45s instead of ~3min.
    runs-on: ubuntu-22.04
    env:
      # Point these tests to the cloud endpoint, because to test the edge-endpoint, they
      # dont actually issue requests. They interally setup a test client and server.
      # The cloud endpoint is needed so that the /me endpoint succeeds and we can actually
      # use the GL client.
      GROUNDLIGHT_ENDPOINT: https://api.groundlight.ai/
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Install uv via the official curl installer instead of astral-sh/setup-uv,
      # since infosec policy disallows third-party GitHub Actions.
      - name: Install uv
        run: |
          set -euo pipefail
          curl -LsSf "https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install edge-endpoint's python dependencies
        run: |
          uv sync --frozen --no-install-project --group profiling

      - name: Run Unit Tests (that dont require docker)
        run: |
          source test/setup_plain_test_env.sh
          # -n auto: one worker per CPU core. --dist loadfile keeps tests in the same
          # file on the same worker, avoiding cross-test state issues from module-scoped
          # fixtures (e.g. the in-memory SQLite test_client).
          uv run pytest -v -k "not _live" -n auto --dist loadfile

      - name: Run load-testing unit tests
        run: |
          cd load-testing
          uv sync --group dev
          uv run pytest --rootdir=. tests/ -v

  test-helm-template:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          token: ${{ github.token }}

      - name: Run edgeArtifactsMap helm template matrix
        run: make test-helm-template

  test-integration-edge-endpoint:
    # Live tests that need a running edge-endpoint Docker container.
    # Pulls the image already built+pushed by call-build-push-ee-image instead of
    # rebuilding locally (the Dockerfile only changes once per commit).
    runs-on: ubuntu-22.04
    needs:
      - call-build-push-ee-image
    env:
      # This is the NGINX proxy endpoint
      GROUNDLIGHT_ENDPOINT: http://localhost:30101
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Install uv via the official curl installer instead of astral-sh/setup-uv,
      # since infosec policy disallows third-party GitHub Actions.
      - name: Install uv
        run: |
          set -euo pipefail
          curl -LsSf "https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install edge-endpoint's python dependencies
        run: |
          uv sync --frozen --no-install-project --group profiling

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_GL_PUBLIC_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_GL_PUBLIC_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: "true"

      - name: Pull edge-endpoint image from ECR
        run: |
          EE_IMAGE_TAG=$(./deploy/bin/git-tag-name.sh)
          ECR_IMAGE=${{ steps.login-ecr.outputs.registry }}/edge-endpoint:${EE_IMAGE_TAG}
          docker pull ${ECR_IMAGE}
          docker tag ${ECR_IMAGE} groundlight-edge

      - name: Start Docker Container
        id: start_container
        run: |
          source test/setup_plain_test_env.sh
          echo "EDGE_CONFIG=$EDGE_CONFIG"
          container_id=$(docker run \
            -e LOG_LEVEL=DEBUG \
            -e EDGE_CONFIG \
            -d -p 30101:30101 -p 30143:443 \
            groundlight-edge)
          echo "container_id=$container_id" >> $GITHUB_OUTPUT

      - name: Verify HTTPS endpoint
        run: |
          # Wait a few seconds for nginx to start and generate certs
          sleep 5
          curl -vk https://localhost:30143/health/live

      - name: Run Live Tests (that do require docker)
        run: |
          source test/setup_plain_test_env.sh
          uv run pytest -k "_live"

      - name: Dump Logs from Docker Container
        if: always()
        run: docker logs ${{ steps.start_container.outputs.container_id }}

      - name: Stop Docker Container
        # This ensures that we always stop the container regardless of the outcomes of
        # the previous steps
        if: always()
        run: docker stop ${{ steps.start_container.outputs.container_id }}

  # Run Groundlight SDK tests against the edge proxy endpoint
  test-sdk:
    # Pulls the image already built+pushed by call-build-push-ee-image instead of
    # rebuilding locally (the Dockerfile only changes once per commit).
    runs-on: ubuntu-22.04
    needs:
      - call-build-push-ee-image
    env:
      # This is the NGINX proxy endpoint
      GROUNDLIGHT_ENDPOINT: http://localhost:30101
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_GL_PUBLIC_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_GL_PUBLIC_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: "true"

      - name: Pull edge-endpoint image from ECR
        run: |
          EE_IMAGE_TAG=$(./deploy/bin/git-tag-name.sh)
          ECR_IMAGE=${{ steps.login-ecr.outputs.registry }}/edge-endpoint:${EE_IMAGE_TAG}
          docker pull ${ECR_IMAGE}
          docker tag ${ECR_IMAGE} groundlight-edge

      - name: Start Docker Container
        id: start_container
        run: |
          source test/setup_plain_test_env.sh
          echo "EDGE_CONFIG=$EDGE_CONFIG"
          container_id=$(docker run \
            -e LOG_LEVEL=DEBUG \
            -e EDGE_CONFIG \
            -d -p 30101:30101 -p 30143:443 \
            groundlight-edge)
          echo "container_id=$container_id" >> $GITHUB_OUTPUT

      - name: Verify HTTPS endpoint
        run: |
          # Wait a few seconds for nginx to start and generate certs
          sleep 5
          curl -vk https://localhost:30143/health/live

      # Install poetry via the official installer instead of snok/install-poetry,
      # since infosec policy disallows third-party GitHub Actions.
      - name: Install Poetry for SDK tests
        run: |
          set -euo pipefail
          curl -sSLf https://install.python-poetry.org | python - --version "${SDK_POETRY_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      # Note that we're pulling the latest main from the SDK repo
      # This might be ahead of what's published to pypi, but it's useful to test things before they're released.
      - name: Checkout Groundlight SDK
        uses: actions/checkout@v4
        with:
          repository: groundlight/python-sdk
          path: groundlight-sdk

      - name: Install Groundlight SDK dependencies
        run: |
          cd groundlight-sdk
          make install

      - name: Run Groundlight SDK tests against Prod API via Edge Proxy Endpoint
        run: |
          cd groundlight-sdk
          make test-4edge
          cd ..

      - name: Dump Logs from Docker Container
        if: always()
        run: docker logs ${{ steps.start_container.outputs.container_id }}

      - name: Stop Docker Container
        # This ensures that we always stop the container regardless of the outcomes of
        # the previous steps
        if: always()
        run: docker stop ${{ steps.start_container.outputs.container_id }}

  call-build-push-ee-image:
    # Gated on the unit-test job so an obvious python regression fails fast in
    # ~1min instead of after a 5min image build. All downstream integration jobs
    # (helm tests, G4, test-sdk, test-integration) consume this image from ECR.
    needs:
      - test-unit-edge-endpoint
    # id-token: write is required for the reusable workflow's OIDC assume of
    # oidc-ghec-edge-push in the master edge-artifacts account on main
    # (reusable workflows can only narrow permissions).
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/build-push-ee-image.yaml
    with:
      repo: ${{ github.repository }}
      ref: ${{ github.ref }}
    secrets:
      AWS_GL_PUBLIC_ACCESS_KEY_ID: ${{ secrets.AWS_GL_PUBLIC_ACCESS_KEY_ID }}
      AWS_GL_PUBLIC_SECRET_ACCESS_KEY: ${{ secrets.AWS_GL_PUBLIC_SECRET_ACCESS_KEY }}

  # After the image is built on main, wait for master→dev ECR replication of
  # this commit's *-main tag, then point `latest` at it in the **dev**
  # edge-artifacts account (Axon-dev environment pointer; master stays
  # build-only). Additive / non-blocking for the GL_Public release chain.
  edge-artifacts-tag-latest:
    if: github.ref == 'refs/heads/main'
    needs:
      - call-build-push-ee-image
    # id-token: write is required for the reusable workflow's OIDC assume of
    # oidc-ghec-edge-tag in the dev account (reusable workflows can only
    # narrow permissions).
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/edge-artifacts-tag-latest.yaml

  validate-setup-helm:
    runs-on: ubuntu-latest-4-cores
    needs:
      - call-build-push-ee-image
    env:
      # associated with roxanne+test_edge account since for some reason it was failing with
      # prod biggies
      GROUNDLIGHT_API_TOKEN: ${{ secrets.K3S_TEST_GROUNDLIGHT_API_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install k3s
        run: |
          ./deploy/bin/install-k3s.sh cpu

      - name: Validate setup edge endpoint
        run: |
          make validate-setup-helm

      - name: Diagnose failure
        if: failure()
        run: |
          NAMESPACE=validate-setup-helm ./deploy/bin/diagnose-k8-failure.sh

  validate-setup-helm-minimal:
    runs-on: ubuntu-latest-4-cores
    needs:
      - call-build-push-ee-image
    env:
      # associated with roxanne+test_edge account since for some reason it was failing with
      # prod biggies
      GROUNDLIGHT_API_TOKEN: ${{ secrets.K3S_TEST_GROUNDLIGHT_API_TOKEN }}
      USE_MINIMAL_IMAGE: true
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install k3s
        run: |
          ./deploy/bin/install-k3s.sh cpu

      - name: Validate setup edge endpoint
        run: |
          make validate-setup-helm

      - name: Diagnose failure
        if: failure()
        run: |
          NAMESPACE=validate-setup-helm ./deploy/bin/diagnose-k8-failure.sh

  call-test-with-k3s-helm:
    needs:
      - call-build-push-ee-image
    uses: ./.github/workflows/test-k3s-helm.yaml
    with:
      repo: ${{ github.repository }}
      ref: ${{ github.ref }}
    secrets:
      K3S_TEST_GROUNDLIGHT_API_TOKEN: ${{ secrets.K3S_TEST_GROUNDLIGHT_API_TOKEN }}

  G4-end-to-end:
    # Note this job can run multiple times in parallel because the stack name is unique
    # for the run.  How much we want to do this is TBD.
    # groundlight-eeut = GL Public VPC runners registered to axon-groundlight (not Axon's
    # shared self-hosted pool). See positronix-ai/ci-infra glpublic-cicd.
    runs-on: [self-hosted, groundlight-eeut]
    needs:
      - call-build-push-ee-image

    permissions:
      contents: read

    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_CICD_PAT }}
      PYTHONUNBUFFERED: 1
      # GITHUB_TOKEN is not an ambient env var, so surface it explicitly. The EEUT
      # uses it to clone the private GHEC repo; it expires when this job ends.
      EEUT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: cicd/pulumi
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Name the stack
        run: |
          # Set to expire in 60 minutes
          EXPIRATION_TIME=$(($(date +%s) + 60 * 60))
          STACK_NAME=ee-cicd-${{ github.run_id }}-expires-${EXPIRATION_TIME}
          echo "STACK_NAME=${STACK_NAME}" | tee -a $GITHUB_ENV
          # We give the stack a name including its expiration time so that the sweeper
          # (in sweeper-eeut.yaml) knows when to get rid of it.
          # This saves us having to clean up here, which can be quite slow (~7 minutes for a g4)

      - name: Check that aws credentials are set
        # Credentials come from an IAM profile on the runner instance
        run: |
          aws sts get-caller-identity

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Pulumi
        run: |
          # HOME is not set on the self-hosted runners, so resolve it before running
          # the installer: otherwise it lands in /.pulumi and the PATH entry misses it.
          export HOME=$(eval echo ~$(whoami))
          curl -fsSL https://get.pulumi.com | sh
          echo "$HOME/.pulumi/bin" >> $GITHUB_PATH

      # Install uv via the official curl installer instead of astral-sh/setup-uv,
      # since infosec policy disallows third-party GitHub Actions.
      - name: Install uv
        run: |
          set -euo pipefail
          export HOME=$(eval echo ~$(whoami))
          export UV_INSTALL_DIR="$HOME/.local/bin"
          curl -LsSf "https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh" | sh
          echo "$UV_INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Make sure uv is working
        run: |
          uv --version
          uv sync --frozen
          uv run python --version

      - name: Check that pulumi is installed and authenticated
        run: |
          uv run pulumi whoami

      - name: Prepare pulumi stack
        run: |
          uv run pulumi stack init ${STACK_NAME}
          uv run pulumi config

      - name: Configure pulumi
        run: |
          # We want to test the exact code that GitHub is running right now
          # For PR runs, this is the merge commit that GitHub creates
          # For main branch runs, this is the latest commit on main
          # Either way, GITHUB_SHA gives us exactly what we need.
          # This is a proper commit in the repo, you just have to fetch it deliberately.
          # It doesn't show up with a normal `git clone`
          COMMIT_TO_TEST=${GITHUB_SHA}
          uv run pulumi config set ee-cicd:targetCommit ${COMMIT_TO_TEST}

          # You might think the EEUT can just derive the image tag itself by running git-tag-name.sh,
          # but it can't because it's on a merge commit.  So it doesn't know the name of the branch.
          # So it would produce an incorrect tag with a name like `1234567-HEAD` which would not match ECR.
          EE_IMAGE_TAG=$(${GITHUB_WORKSPACE}/deploy/bin/git-tag-name.sh)
          uv run pulumi config set ee-cicd:eeImageTag ${EE_IMAGE_TAG}

          # Inject the API token into the pulumi stack
          uv run pulumi config set ee-cicd:groundlightApiToken ${GROUNDLIGHT_API_TOKEN} --secret

          # Short-lived workflow token so the EEUT can clone the private GHEC repo
          # and fetch this run's merge commit (not present on the public mirror).
          if [ -z "${EEUT_GITHUB_TOKEN}" ]; then
            echo "EEUT_GITHUB_TOKEN is empty; the EEUT could not clone the repo."
            exit 1
          fi
          uv run pulumi config set ee-cicd:githubRepoToken "${EEUT_GITHUB_TOKEN}" --secret

      - name: Create the EEUT instance
        run: |
          uv run pulumi up --yes

      - name: Check that EE install succeeded
        run: |
          uv run fab connect --patience=300
          uv run fab wait-for-ee-setup

      - name: Wait for K8 to load everything
        run: |
          uv run fab check-k8-deployments
          uv run fab check-server-port

      - name: Configure edge detector and wait for inference pod ready
        id: configure
        run: |
          EEUT_IP=$(uv run pulumi stack output eeut_private_ip)
          export GROUNDLIGHT_ENDPOINT=https://${EEUT_IP}:30143
          export DISABLE_TLS_VERIFY=1  # the edge endpoint uses a self-signed TLS certificate
          DETECTOR_ID=$(uv run python ${GITHUB_WORKSPACE}/cicd/scripts/configure_edge_detector.py)
          echo "detector_id=${DETECTOR_ID}" >> $GITHUB_OUTPUT

      - name: Verify GPU is allocated to inference pod
        run: |
          uv run fab check-gpu --detector-id=${{ steps.configure.outputs.detector_id }}

      - name: Submit image query and assert it came from edge
        run: |
          EEUT_IP=$(uv run pulumi stack output eeut_private_ip)
          export GROUNDLIGHT_ENDPOINT=https://${EEUT_IP}:30143
          export DISABLE_TLS_VERIFY=1  # the edge endpoint uses a self-signed TLS certificate
          uv run python ${GITHUB_WORKSPACE}/cicd/scripts/submit_edge_iq.py \
            --detector-id=${{ steps.configure.outputs.detector_id }}

      - name: Diagnose EEUT on failure
        if: failure()
        run: |
          uv run fab diagnose-inference || true

      - name: Thank the worker and shut down
        # if: always()
        # Only turn it off if the tests all pass.  If not, leave the failed machine up to debug.
        # The grim sweeper will turn it off in an hour or so.
        run: |
          echo "Strong work, G4!  You did it.  Now go to sleep. The grim sweeper will visit soon."
          uv run fab shutdown-instance

      - name: Instructions for connecting to a failed worker to debug
        if: always()
        run: |
          # Purely informational, so never let it fail the job and bury the real error.
          EEUT_IP=$(uv run pulumi stack output eeut_private_ip 2>/dev/null || echo "unknown")
          echo "If the tests failed, the EEUT (edge endpoint under test) is still running."
          echo "To connect to it, see the Debugging EEUT runbook.  You'll want to know:"
          echo "export EEUT_IP=${EEUT_IP}"
          echo "export EEUT_STACK_NAME=${STACK_NAME}"

  main-tests-pass:
    runs-on: ubuntu-latest
    # This is a dummy step to avoid repeating the list of tests
    needs:
      - test-unit-edge-endpoint
      - test-helm-template
      - test-integration-edge-endpoint
      - test-sdk
      - call-test-with-k3s-helm
      - validate-setup-helm
      - G4-end-to-end
    steps:
      - name: declare success
        run: echo "Main suite of tests all pass."
  
  preview-release-notes:
    # Cheap and informational: shows commits on main since the image currently
    # tagged `release` in ECR was built (i.e. since the last tag-release run).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history needed so we can walk back to the released commit.
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_GL_PUBLIC_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_GL_PUBLIC_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Preview what release notes would be
        run: |
          # The image currently tagged `release` was also tagged "<sha9>-main"
          # by tag-edge-endpoint-image.sh / git-tag-name.sh, so we can recover
          # the released commit from ECR's tag list.
          tags=$(aws ecr describe-images \
            --repository-name edge-endpoint \
            --image-ids imageTag=release \
            --query 'imageDetails[0].imageTags' \
            --output text 2>/dev/null || true)
          last_release_sha=$(echo "$tags" | tr '\t' '\n' | grep -E '^[0-9a-f]{9}-main$' | head -1 | cut -d- -f1 || true)
          if [[ -z "$last_release_sha" ]]; then
            echo "Could not find a <sha>-main tag on the current 'release' image."
            echo "Tags found: $tags"
            exit 0
          fi
          echo "Last released commit: $last_release_sha"
          release_notes=$(git log --pretty=format:'- %s (%h)' "$last_release_sha"..HEAD)
          echo -e "If released now, the release notes would be:\n$release_notes"

  tag-pre-release:
    if: github.ref == 'refs/heads/main'
    needs:
      - main-tests-pass
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_GL_PUBLIC_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_GL_PUBLIC_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: "true"
      - name: Check out code
        uses: actions/checkout@v4

      - name: Tag main images with the "pre-release" tag after all the tests pass
        run: ./deploy/bin/tag-edge-endpoint-image.sh pre-release

  tag-release:
    # The environment rules are not defined in code -- instead, they are defined in the Github UI:
    #   https://github.com/groundlight/edge-endpoint/settings/environments/5838966020/edit
    # As of this time of writing, the environment rules require manual approval for tagging a release.
    environment: live
    # This will run (after manual approval) if a commit is pushed to the `main` branch
    if: github.ref == 'refs/heads/main'
    needs:
      - main-tests-pass
      - tag-pre-release
    runs-on: ubuntu-22.04
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_GL_PUBLIC_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_GL_PUBLIC_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: "true"
      - name: Check out code
        uses: actions/checkout@v4
      - name: Tag main images with the "latest" and "release" tags
        run: |-
          ./deploy/bin/tag-edge-endpoint-image.sh latest
          ./deploy/bin/tag-edge-endpoint-image.sh release

  # Customer-facing Helm charts live on public groundlight/edge-endpoint gh-pages
  # (https://code.groundlight.ai/edge-endpoint/). Publish there with the Mirror
  # App — same auth pattern as mirror-to-public — instead of GHEC origin.
  # Axon private OCI dual-publish is publish-chart-edge-artifacts (sibling job).
  publish-chart:
    if: github.ref == 'refs/heads/main'
    needs:
      - tag-release
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MIRROR_APP_ID }}
          private-key: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
          owner: groundlight
          repositories: edge-endpoint

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          # checkout otherwise leaves an http.https://github.com/.extraheader
          # credential for GITHUB_TOKEN, which wins over the App token when
          # pushing to the public repo.
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create deploy worktree from public gh-pages
        env:
          MIRROR_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          echo "::add-mask::${MIRROR_TOKEN}"

          git remote add public \
            "https://github.com/groundlight/edge-endpoint.git"
          git config --local credential.helper \
            "!f() { echo username=x-access-token; echo password=\${MIRROR_TOKEN}; }; f"

          git fetch public gh-pages
          git worktree add .deploy public/gh-pages

      - name: Package chart into .deploy
        run: |
          helm package ./deploy/helm/groundlight-edge-endpoint --destination .deploy --dependency-update

      - name: Update Helm index.yaml
        run: |
          helm repo index .deploy \
            --url https://code.groundlight.ai/edge-endpoint/ \
            --merge .deploy/index.yaml

      - name: Commit and push to public gh-pages
        env:
          MIRROR_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          echo "::add-mask::${MIRROR_TOKEN}"
          cd .deploy
          git add .
          git commit -m "Publish Helm chart $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || echo "Nothing to commit"
          git push public HEAD:refs/heads/gh-pages

  # Dual-publish Helm chart to Axon edge-artifacts ECR as OCI on merge to
  # main (same gate model as image dual-publish / zuuul gl-edge-inference:
  # not gated on legacy GL_Public tag-release). Public gh-pages publish above
  # remains on the tag-release path. Requires oidc-ghec-edge-push trust
  # (aws-global#478/#494). Replication edge/* master→dev covers charts
  # ([GL-1797]); mutable `latest` is applied in **dev only** by the job below.
  publish-chart-edge-artifacts:
    if: github.ref == 'refs/heads/main'
    needs:
      - main-tests-pass
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      EDGE_ECR_URL: 794562053834.dkr.ecr.us-west-2.amazonaws.com
    steps:
      - name: Configure AWS credentials for edge master ECR (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::794562053834:role/oidc-ghec-edge-push
          aws-region: us-west-2
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v3
      - name: Package and push chart to edge-artifacts OCI
        run: ./deploy/bin/publish-edge-artifacts-helm-chart.sh

  # After the chart is pushed to master, wait for master→dev ECR replication
  # of Chart.yaml version, then point `latest` at it in the **dev**
  # edge-artifacts account (Axon-dev environment pointer; master stays
  # version-only). Mirrors edge-artifacts-tag-latest for the container image.
  edge-artifacts-tag-chart-latest:
    if: github.ref == 'refs/heads/main'
    needs:
      - publish-chart-edge-artifacts
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      EDGE_ARTIFACTS_ACCOUNT: "216731772508"
      EDGE_ARTIFACTS_REGION: "us-west-2"
      EDGE_ARTIFACTS_TAG_ROLE: "oidc-ghec-edge-tag"
    steps:
      - name: Configure AWS credentials for dev edge-artifacts ECR (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.EDGE_ARTIFACTS_ACCOUNT }}:role/${{ env.EDGE_ARTIFACTS_TAG_ROLE }}
          aws-region: ${{ env.EDGE_ARTIFACTS_REGION }}
      - name: Check out code
        uses: actions/checkout@v4
      - name: Wait for replicated chart version in dev ECR
        env:
          ECR_ACCOUNT: ${{ env.EDGE_ARTIFACTS_ACCOUNT }}
          ECR_REGION: ${{ env.EDGE_ARTIFACTS_REGION }}
          WAIT_TIMEOUT_SECONDS: "600"
        run: |
          set -euo pipefail
          CHART_NAME=$(awk '/^name:/ { print $2; exit }' deploy/helm/groundlight-edge-endpoint/Chart.yaml)
          CHART_VERSION=$(awk '/^version:/ { print $2; exit }' deploy/helm/groundlight-edge-endpoint/Chart.yaml)
          export ECR_REPOSITORY="edge/${CHART_NAME}"
          export ECR_IMAGE_TAG="${CHART_VERSION}"
          ./deploy/bin/wait-for-ecr-image.sh
      - name: Tag latest in the dev edge-artifacts account
        env:
          ECR_ACCOUNT: ${{ env.EDGE_ARTIFACTS_ACCOUNT }}
          ECR_REGION: ${{ env.EDGE_ARTIFACTS_REGION }}
        run: ./deploy/bin/tag-edge-artifacts-helm-chart.sh latest
